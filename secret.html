<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Secreta</title>
    <style>
        body {
            background-color: #fce4ec; /* Rosa muy clarito */
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 50px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.5rem; /* Ajustado para que quepa mejor en celulares */
            color: #d81b60;
            text-shadow: 2px 2px #fff;
            padding: 0 15px;
        }
        p {
            color: #ad1457;
            font-style: italic;
        }
        /* Estilo del Carrusel */
        .carousel-container {
            width: 85%;
            max-width: 500px;
            margin: 30px auto;
            overflow: hidden;
            border: 5px solid white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: white;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-track img {
            width: 100%;
            height: auto;
            flex-shrink: 0;
            object-fit: cover;
        }
        .nav-btn {
            background: #d81b60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .nav-btn:hover {
            background: #ad1457;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <audio id="musicaFondo" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <h1>Gracias por haber sido parte de mi vida, Te amo</h1>
    <p>No Feliz quinto aniversario no cumplido</p>

    <div class="carousel-container">
        <div class="carousel-track" id="track">
            <img src="photo1.jpg" alt="Foto 1">
            <img src="photo2.jpg" alt="Foto 2">
            <img src="photo3.jpg" alt="Foto 3">
            <img src="photo4.jpg" alt="Foto 4">
            <img src="photo5.jpg" alt="Foto 5">
            <img src="photo6.jpg" alt="Foto 6">
            <img src="photo7.jpg" alt="Foto 7">
            <img src="photo8.jpg" alt="Foto 8">
        </div>
    </div>

    <button class="nav-btn" onclick="move(-1)">Anterior</button>
    <button class="nav-btn" onclick="move(1)">Siguiente</button>

    <script>
        let index = 0;
        const track = document.getElementById('track');
        const images = document.querySelectorAll('.carousel-track img');
        const audio = document.getElementById('musicaFondo');
        let musicStarted = false;

        function move(direction) {
            if (!musicStarted) {
                audio.play();
                musicStarted = true;
            }

            index += direction;
            if (index >= images.length) index = 0;
            if (index < 0) index = images.length - 1;
            
            const amountToMove = images[0].clientWidth;
            track.style.transform = `translateX(-${index * amountToMove}px)`;
        }

        
        window.addEventListener('load', () => {
            audio.volume = 0.5; 
        });
    </script>
</body>
</html>
